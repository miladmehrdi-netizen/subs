name: Manual sub rename

on:
  push:
    paths:
      - "manual/raw.txt"
  workflow_dispatch: {}

permissions:
  contents: write   # لازم برای commit مستقیم به همین ریپوی عمومی

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      - name: Run rename script
        run: python manual/rename.py

      - name: Commit updated manual/sub.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manual/sub.txt
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "manual sub: rename update $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin main
